templates:
  Chart:
    sort_title: +1_<<num>><<collection_name>>
    sync_mode: sync
    smart_label: random
  TV:
    optional:
      - collection
      - tmdb_show
      - tvdb_show
      - imdb_list
      - tmdb_list
      - tpdb_id
    tmdb_collection_details: <<collection>>
    tmdb_show: <<tmdb_show>>
    tvdb_show: <<tvdb_show>>
    tmdb_list: <<tmdb_list>>
    imdb_list: 
      list_id: <<imdb_list>>
    sync_mode: sync
    url_poster: https://theposterdb.com/api/assets/<<tpdb_id>>/view
    sort_title: <<collection_name>>
    collection_order: release
    collection_mode: hide
